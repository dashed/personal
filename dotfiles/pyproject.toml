[project]
name = "dotfiles-sync"
version = "1.0.0"
description = "Declarative dotfiles management system with safety-first approach"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.7",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "rich>=13.8.0",
]

[project.scripts]
dotfiles-sync = "dotfiles_sync.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=5.0.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=dotfiles_sync --cov-report=term-missing"

[tool.uv]
package = true
